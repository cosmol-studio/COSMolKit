[workspace]
members = [
    "parity-tests",
    "crates/cosmolkit-core",
    "crates/cosmolkit-cx",
    "crates/cosmolkit-smiles",
    "crates/cosmolkit-search",
    "crates/cosmolkit-reaction",
    "crates/cosmolkit-io",
    "crates/cosmolkit-descriptors",
    "crates/cosmolkit-fingerprints",
    "crates/cosmolkit-stereo",
    "crates/cosmolkit-tautomer",
    "crates/cosmolkit-conformer",
    "crates/cosmolkit-forcefields",
    "crates/cosmolkit-alignment",
    "crates/cosmolkit-depict",
    "crates/cosmolkit-batch",
    "crates/cosmolkit-bio",
    "crates/cosmolkit-types",
    "crates/cosmolkit-model",
    "crates/cosmolkit-inchi",
    "crates/cosmolkit-ringdecomposer",
    "crates/cosmolkit",
    "crates/cosmolkit-macros",
    "crates/cosmolkit-macros-old",
    "python",
]
resolver = "2"
# WASM owns its target-specific toolchain lock and is checked by its build entrypoint.
exclude = ["wasm", "wasm_old", "tmp/alef/wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.6.0-rc.2"
authors = ["COSMolKit Contributors"]
description = "Core cheminformatics and structural biology toolkit in Rust"
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://tools.cosmol.org/"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Optimized development tests avoid expensive whole-program optimization.
[profile.dev-test]
inherits = "release"
lto = "off"
codegen-units = 16
