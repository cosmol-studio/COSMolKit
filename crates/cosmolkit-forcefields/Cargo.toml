[package]
name = "cosmolkit-forcefields"
description = "UFF and MMFF force-field algorithms over detached model values"
keywords = ["cheminformatics", "force-field", "mmff", "uff"]
categories = ["science", "algorithms"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-macros = { path = "../cosmolkit-macros", version = "0.6.0-rc.1" }
cosmolkit-core = { version = "0.6.0-rc.1", path = "../cosmolkit-core", default-features = false }
cosmolkit-model = { version = "0.6.0-rc.1", path = "../cosmolkit-model" }
cosmolkit-search = { version = "0.6.0-rc.1", path = "../cosmolkit-search", default-features = false }
thiserror = "2"

[dev-dependencies]
cosmolkit-model = { version = "0.6.0-rc.1", path = "../cosmolkit-model", features = ["runtime-invariants", "op-contracts"] }
cosmolkit-smiles = { version = "0.6.0-rc.1", path = "../cosmolkit-smiles" }
cosmolkit-io = { version = "0.6.0-rc.1", path = "../cosmolkit-io" }
