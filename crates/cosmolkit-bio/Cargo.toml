[package]
name = "cosmolkit-bio"
description = "Structural-biology values and algorithms for COSMolKit"
keywords = ["structural-biology", "pdb", "macromolecules"]
categories = ["science", "data-structures"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[features]
# Narrowly authorized test infrastructure (BIO-ROWS-PROBE): exposes the
# doc-hidden __bio_rows_probe bridge for the owning IO integration tests
# ONLY when explicitly enabled. Never default; never production.
test-probes = []

[dependencies]
cosmolkit-macros = { version = "0.6.0-dev.2", path = "../cosmolkit-macros" }
cosmolkit-model = { version = "0.6.0-dev.2", path = "../cosmolkit-model" }
cosmolkit-types = { version = "0.6.0-dev.2", path = "../cosmolkit-types" }
serde = "1"
compact_str = { version = "0.10.0", default-features = false, features = ["std"] }

[dev-dependencies]
# BIO-SERDE1-28: derive is dev-only for the external derive-consumer
# proof; production keeps the derive-less serde edge.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "residue_code_serde"
