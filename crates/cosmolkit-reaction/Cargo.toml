[package]
name = "cosmolkit-reaction"
description = "Detached source-backed reaction templates and execution"
keywords = ["cheminformatics", "reactions", "smirks", "chemistry"]
categories = ["science", "algorithms"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-macros = { path = "../cosmolkit-macros", version = "0.6.0-rc.4" }
cosmolkit-types = { version = "0.6.0-rc.4", path = "../cosmolkit-types" }
cosmolkit-model = { version = "0.6.0-rc.4", path = "../cosmolkit-model" }
cosmolkit-core = { version = "0.6.0-rc.4", path = "../cosmolkit-core" }
cosmolkit-search = { version = "0.6.0-rc.4", path = "../cosmolkit-search", default-features = false, features = ["smiles-integration"] }
cosmolkit-smiles = { version = "0.6.0-rc.4", path = "../cosmolkit-smiles" }
cosmolkit-cx = { version = "0.6.0-rc.4", path = "../cosmolkit-cx" }
thiserror = "2"

[dev-dependencies]
cosmolkit-model = { version = "0.6.0-rc.4", path = "../cosmolkit-model", features = ["runtime-invariants", "op-contracts"] }
