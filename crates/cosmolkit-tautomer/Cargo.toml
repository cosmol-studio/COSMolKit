[package]
name = "cosmolkit-tautomer"
description = "Tautomer enumeration and normalization over detached model values"
keywords = ["cheminformatics", "tautomer", "molecules"]
categories = ["science", "algorithms"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-model = { version = "0.5.0-rc.17", path = "../cosmolkit-model" }

cosmolkit-search = { version = "0.5.0-rc.17", path = "../cosmolkit-search" }
cosmolkit-types = { version = "0.5.0-rc.17", path = "../cosmolkit-types" }
cosmolkit-core = { version = "0.5.0-rc.17", path = "../cosmolkit-core" }
cosmolkit-smiles = { version = "0.5.0-rc.17", path = "../cosmolkit-smiles" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
