[package]
name = "cosmolkit-tautomer"
description = "Tautomer enumeration and normalization over detached model values"
keywords = ["cheminformatics", "tautomer", "molecules"]
categories = ["science", "algorithms"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-macros = { path = "../cosmolkit-macros", version = "0.5.1-rc.5" }
cosmolkit-model = { version = "0.5.1-rc.5", path = "../cosmolkit-model" }

cosmolkit-search = { version = "0.5.1-rc.5", path = "../cosmolkit-search", default-features = false }
cosmolkit-types = { version = "0.5.1-rc.5", path = "../cosmolkit-types" }
cosmolkit-core = { version = "0.5.1-rc.5", path = "../cosmolkit-core" }
cosmolkit-smiles = { version = "0.5.1-rc.5", path = "../cosmolkit-smiles" }
thiserror = "2"

[dev-dependencies]
cosmolkit-model = { version = "0.5.1-rc.5", path = "../cosmolkit-model", features = ["runtime-invariants", "op-contracts"] }
serde_json = "1"
tempfile = "3"
