[package]
name = "cosmolkit-search"
description = "SMARTS, query planning, matching, and MCS over COSMolKit model values"
keywords = ["cheminformatics", "smarts", "substructure", "search"]
categories = ["science", "algorithms"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[features]
# Complete concrete/CX writer paths reuse the sole SMILES implementation.
# Parsing, matching, MCS and ordinary/recursive SMARTS writing remain available
# to lightweight internal consumers without this optional dependency.
default = ["smiles-integration"]
smiles-integration = ["dep:cosmolkit-smiles"]

[dependencies]
cosmolkit-smiles = { version = "0.5.0-rc.17", path = "../cosmolkit-smiles", optional = true }
cosmolkit-cx = { version = "0.5.0-rc.17", path = "../cosmolkit-cx" }
cosmolkit-core = { version = "0.5.0-rc.17", path = "../cosmolkit-core" }
cosmolkit-model = { version = "0.5.0-rc.17", path = "../cosmolkit-model" }
cosmolkit-types = { version = "0.5.0-rc.17", path = "../cosmolkit-types" }
serde_json = "1"
thiserror = "2"

[[test]]
name = "migration_q_writer"
required-features = ["smiles-integration"]
