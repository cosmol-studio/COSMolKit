[package]
name = "cosmolkit-model"
description = "Shared concrete molecular value model for COSMolKit algorithms"
keywords = ["chemistry", "molecule", "graph", "cheminformatics"]
categories = ["science", "data-structures"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[features]
default = []
runtime-invariants = []
op-contracts = []

[dependencies]
cosmolkit-types = { version = "0.5.1-rc.1", path = "../cosmolkit-types" }
cosmolkit-ringdecomposer = { version = "0.5.1-rc.1", path = "../cosmolkit-ringdecomposer" }
thiserror = "2.0.18"
serde_json = "1"
