[package]
name = "cosmolkit"
description = "Rust-native cheminformatics and structural biology toolkit for molecules, SMILES, SDF, molecular graphs, conformers, and AI-ready workflows"
keywords = ["cheminformatics", "molecule", "smiles", "sdf", "bioinformatics"]
categories = ["science", "parser-implementations", "data-structures"]
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://tools.cosmol.org/"
documentation = "https://docs.rs/cosmolkit"
readme = "./README.md"
license.workspace = true
version.workspace = true
edition.workspace = true
autoexamples = false

[lib]
name = "cosmolkit"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["full"]
no-default-features = true

[features]
default = ["full"]
runtime-invariants = []
op-contracts = []
op-contracts-strict = ["runtime-invariants", "op-contracts"]
full = [
    "core",
    "bio",
    "conformer",
    "depict",
    "descriptors",
    "fingerprints",
    "inchi",
    "search",
    "tautomer",
    "stereoisomers",
    "reaction",
]

# Public bundles expose only their declared domain prerequisites.
core = [
    "cap-smiles",
    "cap-hydrogens", "cap-valence", "cap-radicals", "cap-rings",
    "cap-matrices", "cap-transforms", "cap-stereo", "cap-kekulize",
    "cap-aromaticity", "cap-sanitize", "cap-io", "cap-serialization", "cap-batch",
]
bio = ["cap-bio"]
descriptors = ["cap-descriptors", "core"]
tautomer = ["cap-tautomer", "search"]
conformer = ["cap-conformer", "cap-confseq", "cap-alignment", "cap-forcefields", "core"]
fingerprints = ["cap-fingerprints", "cap-hashing", "core"]
search = ["cap-search", "core"]
reaction = ["cap-reaction", "search"]
stereoisomers = ["cap-stereoisomers", "core"]
depict = ["cap-depict", "core"]
inchi = ["cap-inchi", "core"]

# Internal algorithm reuse does not enable unrelated public capabilities.
# Shared model/core implementation dependencies do not select all core algorithms.
cap-alignment = ["dep:cosmolkit-alignment", "dep:cosmolkit-core"]
cap-batch = ["dep:cosmolkit-batch", "cap-io"]
cap-bio = ["dep:cosmolkit-bio", "dep:cosmolkit-io", "cosmolkit-io/bio"]
cap-conformer = ["dep:cosmolkit-conformer", "cap-forcefields", "cap-alignment", "cap-io"]
cap-hydrogens = ["dep:cosmolkit-core"]
cap-confseq = ["dep:cosmolkit-conformer", "cap-conformer"]
cap-depict = ["dep:cosmolkit-depict", "cosmolkit-io?/depict"]
cap-descriptors = ["dep:cosmolkit-descriptors", "dep:cosmolkit-core"]
cap-fingerprints = ["dep:cosmolkit-fingerprints", "dep:cosmolkit-core"]
cap-forcefields = ["dep:cosmolkit-forcefields", "dep:cosmolkit-core"]
cap-hashing = ["dep:cosmolkit-fingerprints", "dep:cosmolkit-core"]
cap-inchi = ["dep:cosmolkit-inchi", "dep:cosmolkit-core"]
cap-io = ["dep:cosmolkit-io", "cosmolkit-io/molecule", "dep:cosmolkit-core"]
cap-matrices = ["dep:cosmolkit-core"]
cap-transforms = ["dep:cosmolkit-core"]
cap-search = ["dep:cosmolkit-search", "cosmolkit-search/smiles-integration", "cosmolkit-io?/search", "cap-smiles"]
cap-serialization = ["cap-io", "cosmolkit-io/binary"]
cap-smiles = ["dep:cosmolkit-smiles", "dep:cosmolkit-core"]
cap-stereo = ["dep:cosmolkit-core", "dep:cosmolkit-stereo"]
cap-stereoisomers = ["dep:cosmolkit-core", "dep:cosmolkit-stereo", "cosmolkit-stereo/enumeration", "dep:cosmolkit-smiles", "dep:num-bigint", "cap-stereo"]
cap-tautomer = ["dep:cosmolkit-tautomer", "dep:cosmolkit-core", "cap-search"]
cap-valence = ["dep:cosmolkit-core"]
cap-radicals = ["dep:cosmolkit-core"]
cap-reaction = ["dep:cosmolkit-reaction", "dep:cosmolkit-core", "cap-search"]
cap-rings = ["dep:cosmolkit-core"]
cap-kekulize = ["dep:cosmolkit-core"]
cap-aromaticity = ["dep:cosmolkit-core"]
cap-sanitize = ["dep:cosmolkit-core"]

[dependencies]
num-bigint = { version = "0.4.8", optional = true }
cosmolkit-model = { version = "0.5.0-rc.20", path = "../cosmolkit-model" }
cosmolkit-macros = { version = "0.5.0-rc.20", path = "../cosmolkit-macros" }
cosmolkit-core = { version = "0.5.0-rc.20", path = "../cosmolkit-core", optional = true }
cosmolkit-reaction = { version = "0.5.0-rc.20", path = "../cosmolkit-reaction", optional = true }
cosmolkit-descriptors = { version = "0.5.0-rc.20", path = "../cosmolkit-descriptors", optional = true }
cosmolkit-alignment = { version = "0.5.0-rc.20", path = "../cosmolkit-alignment", optional = true }
cosmolkit-batch = { version = "0.5.0-rc.20", path = "../cosmolkit-batch", optional = true }
cosmolkit-bio = { version = "0.5.0-rc.20", path = "../cosmolkit-bio", optional = true }
cosmolkit-conformer = { version = "0.5.0-rc.20", path = "../cosmolkit-conformer", optional = true }
cosmolkit-depict = { version = "0.5.0-rc.20", path = "../cosmolkit-depict", optional = true }
cosmolkit-fingerprints = { version = "0.5.0-rc.20", path = "../cosmolkit-fingerprints", optional = true }
cosmolkit-forcefields = { version = "0.5.0-rc.20", path = "../cosmolkit-forcefields", optional = true }
cosmolkit-inchi = { version = "0.5.0-rc.20", path = "../cosmolkit-inchi", optional = true }
cosmolkit-io = { version = "0.5.0-rc.20", path = "../cosmolkit-io", optional = true, default-features = false }
cosmolkit-search = { version = "0.5.0-rc.20", path = "../cosmolkit-search", optional = true, default-features = false }
cosmolkit-smiles = { version = "0.5.0-rc.20", path = "../cosmolkit-smiles", optional = true }
cosmolkit-stereo = { version = "0.5.0-rc.20", path = "../cosmolkit-stereo", optional = true, default-features = false }
cosmolkit-tautomer = { version = "0.5.0-rc.20", path = "../cosmolkit-tautomer", optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1.1"

