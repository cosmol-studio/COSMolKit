[package]
name = "cosmolkit"
description = "Rust-native cheminformatics and structural biology toolkit for molecules, SMILES, SDF, molecular graphs, conformers, and AI-ready workflows"
keywords = ["cheminformatics", "molecule", "smiles", "sdf", "bioinformatics"]
categories = ["science", "parser-implementations", "data-structures"]
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://tools.cosmol.org/"
documentation = "https://docs.rs/cosmolkit"
readme = "./README.md"
license.workspace = true
version.workspace = true
edition.workspace = true
autoexamples = false

[lib]
name = "cosmolkit"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["full"]
no-default-features = true

[features]
default = ["full"]
runtime-invariants = []
op-contracts = []
op-contracts-strict = ["runtime-invariants", "op-contracts"]
full = [
    "core",
    "batch",
    "bio",
    "conformer",
    "depict",
    "fingerprints",
    "forcefields",
    "inchi",
    "search",
]

# User bundles: explicit API composition, not implementation dependencies.
core = [
    "cap-smiles", "cap-io", "cap-serialization", "cap-descriptors",
    "cap-hydrogens", "cap-valence", "cap-radicals", "cap-rings",
    "cap-matrices", "cap-transforms", "cap-stereo", "cap-kekulize",
    "cap-aromaticity", "cap-sanitize", "cap-stereoisomers", "cap-tautomer",
]
bio = ["cap-bio"]
conformer = ["cap-conformer", "cap-confseq", "cap-alignment"]
forcefields = ["cap-forcefields"]
fingerprints = ["cap-fingerprints", "cap-hashing"]
search = ["cap-search"]
depict = ["cap-depict"]
inchi = ["cap-inchi"]
batch = ["cap-batch"]

# Advanced capabilities: gate only their own API and direct dependency edges.
cap-alignment = ["dep:cosmolkit-alignment"]
cap-batch = ["dep:cosmolkit-batch"]
cap-bio = ["dep:cosmolkit-bio", "dep:cosmolkit-io", "cosmolkit-io/bio"]
cap-conformer = ["dep:cosmolkit-conformer"]
cap-hydrogens = ["dep:cosmolkit-core"]
cap-confseq = ["dep:cosmolkit-conformer"]
cap-depict = ["dep:cosmolkit-depict"]
cap-descriptors = ["dep:cosmolkit-descriptors", "dep:cosmolkit-core"]
cap-fingerprints = ["dep:cosmolkit-fingerprints"]
cap-forcefields = ["dep:cosmolkit-forcefields"]
cap-hashing = ["dep:cosmolkit-fingerprints"]
cap-inchi = ["dep:cosmolkit-inchi"]
cap-io = ["dep:cosmolkit-io"]
cap-matrices = ["dep:cosmolkit-core"]
cap-transforms = ["dep:cosmolkit-core"]
cap-search = ["dep:cosmolkit-search"]
cap-serialization = ["dep:cosmolkit-io"]
cap-smiles = ["dep:cosmolkit-smiles", "dep:cosmolkit-core"]
cap-stereo = ["dep:cosmolkit-core", "dep:cosmolkit-stereo"]
cap-stereoisomers = ["dep:cosmolkit-stereo"]
cap-tautomer = ["dep:cosmolkit-tautomer"]
cap-valence = ["dep:cosmolkit-core"]
cap-radicals = ["dep:cosmolkit-core"]
cap-rings = ["dep:cosmolkit-core"]
cap-kekulize = ["dep:cosmolkit-core"]
cap-aromaticity = ["dep:cosmolkit-core"]
cap-sanitize = ["dep:cosmolkit-core"]

[dependencies]
cosmolkit-model = { version = "0.5.0-rc.9", path = "../cosmolkit-model" }
cosmolkit-macros = { version = "0.5.0-rc.9", path = "../cosmolkit-macros" }
cosmolkit-core = { version = "0.5.0-rc.9", path = "../cosmolkit-core", optional = true }
cosmolkit-descriptors = { version = "0.5.0-rc.9", path = "../cosmolkit-descriptors", optional = true }
cosmolkit-alignment = { version = "0.5.0-rc.9", path = "../cosmolkit-alignment", optional = true }
cosmolkit-batch = { version = "0.5.0-rc.9", path = "../cosmolkit-batch", optional = true }
cosmolkit-bio = { version = "0.5.0-rc.9", path = "../cosmolkit-bio", optional = true }
cosmolkit-conformer = { version = "0.5.0-rc.9", path = "../cosmolkit-conformer", optional = true }
cosmolkit-depict = { version = "0.5.0-rc.9", path = "../cosmolkit-depict", optional = true }
cosmolkit-fingerprints = { version = "0.5.0-rc.9", path = "../cosmolkit-fingerprints", optional = true }
cosmolkit-forcefields = { version = "0.5.0-rc.9", path = "../cosmolkit-forcefields", optional = true }
cosmolkit-inchi = { version = "0.5.0-rc.9", path = "../cosmolkit-inchi", optional = true }
cosmolkit-io = { version = "0.5.0-rc.9", path = "../cosmolkit-io", optional = true }
cosmolkit-search = { version = "0.5.0-rc.9", path = "../cosmolkit-search", optional = true }
cosmolkit-smiles = { version = "0.5.0-rc.9", path = "../cosmolkit-smiles", optional = true }
cosmolkit-stereo = { version = "0.5.0-rc.9", path = "../cosmolkit-stereo", optional = true }
cosmolkit-tautomer = { version = "0.5.0-rc.9", path = "../cosmolkit-tautomer", optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "migration_bio_read_api"
required-features = ["cap-bio"]

[[test]]
name = "migration_bio_residue_api"
required-features = ["cap-bio"]

[[test]]
name = "migration_bio_hierarchy_api"
required-features = ["cap-bio"]

[[test]]
name = "migration_bio_protein_api"
required-features = ["cap-bio"]

[[test]]
name = "migration_io_bio_pdb_api"
required-features = ["cap-bio"]

[[test]]
name = "migration_io_bio_mmcif_api"
required-features = ["cap-bio"]

[[test]]
name = "migration_bio_privacy"
required-features = ["cap-bio"]

# Facade API regressions must request the capability whose API they exercise.
# Minimal builds still run capability-independent model/runtime regressions.
[[test]]
name = "migration_bio_selection_api"
required-features = ["cap-bio"]

[[test]]
name = "migration_chem_aromaticity_api"
required-features = ["cap-aromaticity"]

[[test]]
name = "migration_chem_kekulize_api"
required-features = ["cap-kekulize"]

[[test]]
name = "migration_chem_sanitize_api"
required-features = ["cap-sanitize"]

[[test]]
name = "migration_core_fast_rings_api"
required-features = ["cap-rings"]

[[test]]
name = "migration_core_ring_families_api"
required-features = ["cap-rings"]

[[test]]
name = "migration_core_matrices_api"
required-features = ["cap-matrices"]

[[test]]
name = "migration_core_potential_api"
required-features = ["cap-stereo"]

[[test]]
name = "migration_core_structure_tags_api"
required-features = ["cap-stereo"]

[[test]]
name = "migration_st_cip_labels_api"
required-features = ["cap-stereo"]

[[test]]
name = "migration_core_radicals_api"
required-features = ["cap-radicals"]

[[test]]
name = "migration_core_transforms_api"
required-features = ["cap-transforms"]

[[test]]
name = "migration_core_valence_api"
required-features = ["cap-valence"]

[[test]]
name = "migration_draw_layout_api"
required-features = ["cap-depict"]

[[test]]
name = "migration_h_add_stereo_api"
required-features = ["cap-hydrogens"]

[[test]]
name = "migration_h_remove_state_api"
required-features = ["cap-hydrogens"]

[[test]]
name = "migration_io_sdf_read_api"
required-features = ["cap-io"]

[[test]]
name = "migration_smi_parser_api"
required-features = ["cap-smiles"]

[[test]]
name = "migration_run_state_api"
required-features = ["op-contracts-strict"]

[[test]]
name = "migration_run_multiple"
required-features = ["op-contracts-strict"]
