[package]
name = "cosmolkit"
description = "Rust-native cheminformatics and structural biology toolkit for molecules, SMILES, SDF, molecular graphs, conformers, and AI-ready workflows"
keywords = ["cheminformatics", "molecule", "smiles", "sdf", "bioinformatics"]
categories = ["science", "parser-implementations", "data-structures"]
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://tools.cosmol.org/"
documentation = "https://docs.rs/cosmolkit"
readme = "./README.md"
license.workspace = true
version.workspace = true
edition.workspace = true
autoexamples = false

[lib]
name = "cosmolkit"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["full"]
no-default-features = true

[features]
default = []
runtime-invariants = []
op-contracts = []
op-contracts-strict = ["runtime-invariants", "op-contracts"]
full = [
    "valence",
    "radicals",
    "rings",
    "matrices",
    "transforms",
    "stereo",
    "kekulize",
    "aromaticity",
    "sanitize",
]
batch = []
hydrogens = ["dep:cosmolkit-core"]
confseq = []
depict = []
descriptors = ["dep:cosmolkit-descriptors"]
fingerprints = []
hashing = []
inchi = []
io = []
matrices = ["dep:cosmolkit-core"]
transforms = ["dep:cosmolkit-core"]
serialization = []
stereo = ["dep:cosmolkit-core"]
stereoisomers = []
valence = ["dep:cosmolkit-core"]
radicals = ["dep:cosmolkit-core"]
rings = ["dep:cosmolkit-core"]
kekulize = ["dep:cosmolkit-core"]
aromaticity = ["dep:cosmolkit-core"]
sanitize = ["dep:cosmolkit-core"]

[dependencies]
cosmolkit-model = { version = "0.5.0-rc.3", path = "../cosmolkit-model" }
cosmolkit-macros = { version = "0.5.0-rc.3", path = "../cosmolkit-macros" }
cosmolkit-core = { version = "0.5.0-rc.3", path = "../cosmolkit-core", optional = true }
cosmolkit-descriptors = { version = "0.5.0-rc.3", path = "../cosmolkit-descriptors", optional = true }
