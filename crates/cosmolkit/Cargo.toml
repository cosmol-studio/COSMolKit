[package]
name = "cosmolkit"
description = "Rust-native cheminformatics and structural biology toolkit for molecules, SMILES, SDF, molecular graphs, conformers, and AI-ready workflows"
keywords = ["cheminformatics", "molecule", "smiles", "sdf", "bioinformatics"]
categories = ["science", "parser-implementations", "data-structures"]
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://tools.cosmol.org/"
documentation = "https://docs.rs/cosmolkit"
readme = "./README.md"
license.workspace = true
version.workspace = true
edition.workspace = true
autoexamples = false

[lib]
name = "cosmolkit"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["full"]
no-default-features = true

[features]
default = ["full"]
runtime-invariants = []
op-contracts = []
op-contracts-strict = ["runtime-invariants", "op-contracts"]
full = [
    "alignment",
    "batch",
    "bio",
    "conformer",
    "confseq",
    "depict",
    "fingerprints",
    "forcefields",
    "hashing",
    "inchi",
    "io",
    "search",
    "serialization",
    "smiles",
    "stereoisomers",
    "tautomer",
    "hydrogens",
    "descriptors",
    "valence",
    "radicals",
    "rings",
    "matrices",
    "transforms",
    "stereo",
    "kekulize",
    "aromaticity",
    "sanitize",
]
alignment = ["dep:cosmolkit-alignment"]
batch = ["dep:cosmolkit-batch"]
bio = ["dep:cosmolkit-bio"]
conformer = ["dep:cosmolkit-conformer"]
hydrogens = ["dep:cosmolkit-core"]
confseq = ["dep:cosmolkit-conformer"]
depict = ["dep:cosmolkit-depict"]
descriptors = ["dep:cosmolkit-descriptors"]
fingerprints = ["dep:cosmolkit-fingerprints"]
forcefields = ["dep:cosmolkit-forcefields"]
hashing = ["dep:cosmolkit-fingerprints"]
inchi = ["dep:cosmolkit-inchi"]
io = ["dep:cosmolkit-io"]
matrices = ["dep:cosmolkit-core"]
transforms = ["dep:cosmolkit-core"]
search = ["dep:cosmolkit-search"]
serialization = ["dep:cosmolkit-io"]
smiles = ["dep:cosmolkit-smiles"]
stereo = ["dep:cosmolkit-core", "dep:cosmolkit-stereo"]
stereoisomers = ["dep:cosmolkit-stereo"]
tautomer = ["dep:cosmolkit-tautomer"]
valence = ["dep:cosmolkit-core"]
radicals = ["dep:cosmolkit-core"]
rings = ["dep:cosmolkit-core"]
kekulize = ["dep:cosmolkit-core"]
aromaticity = ["dep:cosmolkit-core"]
sanitize = ["dep:cosmolkit-core"]

[dependencies]
cosmolkit-model = { version = "0.5.0-rc.3", path = "../cosmolkit-model" }
cosmolkit-macros = { version = "0.5.0-rc.3", path = "../cosmolkit-macros" }
cosmolkit-core = { version = "0.5.0-rc.3", path = "../cosmolkit-core", optional = true }
cosmolkit-descriptors = { version = "0.5.0-rc.3", path = "../cosmolkit-descriptors", optional = true }
cosmolkit-alignment = { version = "0.5.0-rc.3", path = "../cosmolkit-alignment", optional = true }
cosmolkit-batch = { version = "0.5.0-rc.3", path = "../cosmolkit-batch", optional = true }
cosmolkit-bio = { version = "0.5.0-rc.3", path = "../cosmolkit-bio", optional = true }
cosmolkit-conformer = { version = "0.5.0-rc.3", path = "../cosmolkit-conformer", optional = true }
cosmolkit-depict = { version = "0.5.0-rc.3", path = "../cosmolkit-depict", optional = true }
cosmolkit-fingerprints = { version = "0.5.0-rc.3", path = "../cosmolkit-fingerprints", optional = true }
cosmolkit-forcefields = { version = "0.5.0-rc.3", path = "../cosmolkit-forcefields", optional = true }
cosmolkit-inchi = { version = "0.5.0-rc.3", path = "../cosmolkit-inchi", optional = true }
cosmolkit-io = { version = "0.5.0-rc.3", path = "../cosmolkit-io", optional = true }
cosmolkit-search = { version = "0.5.0-rc.3", path = "../cosmolkit-search", optional = true }
cosmolkit-smiles = { version = "0.5.0-rc.3", path = "../cosmolkit-smiles", optional = true }
cosmolkit-stereo = { version = "0.5.0-rc.3", path = "../cosmolkit-stereo", optional = true }
cosmolkit-tautomer = { version = "0.5.0-rc.3", path = "../cosmolkit-tautomer", optional = true }
