categories = ["science", "algorithms"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-core = { version = "0.5.0-rc.22", path = "../cosmolkit-core" }
cosmolkit-model = { version = "0.5.0-rc.22", path = "../cosmolkit-model" }
cosmolkit-types = { version = "0.5.0-rc.22", path = "../cosmolkit-types" }
