[package]
name = "cosmolkit-core"
description = "Detached source-backed chemistry algorithms for COSMolKit"
keywords = ["cheminformatics", "molecule", "chemistry"]
categories = ["science", "data-structures"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[lib]
name = "cosmolkit_core"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
cosmolkit-model = { version = "0.5.0-rc.23", path = "../cosmolkit-model" }
cosmolkit-ringdecomposer = { version = "0.5.0-rc.23", path = "../cosmolkit-ringdecomposer" }
cosmolkit-types = { version = "0.5.0-rc.23", path = "../cosmolkit-types" }
thiserror = "2.0.18"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
