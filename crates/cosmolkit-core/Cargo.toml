[package]
name = "cosmolkit-core"
description = "Redesigned COSMolKit core with value-style molecule state and explicit topology operation contracts"
keywords = ["cheminformatics", "molecule", "graph", "chemistry"]
categories = ["science", "data-structures"]
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://github.com/cosmol-studio/COSMolKit"
documentation = "https://docs.rs/cosmolkit"
readme = "../../README.md"
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
name = "cosmolkit_core"
path = "src/lib.rs"

[features]
default = []
runtime-invariants = []
op-contracts = []
op-contracts-strict = ["runtime-invariants", "op-contracts"]

[dependencies]
cosmolkit-inchi = { version = "0.2.12", path = "../cosmolkit-inchi" }
cosmolkit-macros = { version = "0.2.12", path = "../cosmolkit-macros" }
cosmolkit-ringdecomposer = { version = "0.2.12", path = "../cosmolkit-ringdecomposer" }
glam = "0.33.1"
indicatif = "0.18"
libc = "0.2"
log = "0.4.29"
rayon = "1.12.0"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tiny-skia = "0.12.0"
usvg = "0.47"
resvg = "0.47"

[dev-dependencies]
cosmolkit-test-support = { path = "../cosmolkit-test-support" }
sha2 = "0.10"
tempfile = "3"
