[package]
name = "cosmolkit-core"
description = "Redesigned COSMolKit core with value-style molecule state and explicit topology operation contracts"
keywords = ["cheminformatics", "molecule", "graph", "chemistry"]
categories = ["science", "data-structures"]
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://github.com/cosmol-studio/COSMolKit"
documentation = "https://docs.rs/cosmolkit"
readme = "../../README.md"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true

[lib]
name = "cosmolkit_core"
path = "src/lib.rs"

[features]
default = []
runtime-invariants = []
op-contracts = []
op-contracts-strict = ["runtime-invariants", "op-contracts"]

[dependencies]
cosmolkit-macros = { version = "0.2.7", path = "../cosmolkit-macros" }
cosmolkit-ringdecomposer = { version = "0.2.7", path = "../cosmolkit-ringdecomposer" }
glam = "0.33.0"
indicatif = "0.18"
libc = "0.2"
log = "0.4.29"
rayon = "1.12.0"
serde_json = "1"
thiserror = "2.0.18"
tiny-skia = "0.12.0"
usvg = "0.47"
resvg = "0.47"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
