[package]
name = "cosmolkit-core"
description = "Detached source-backed chemistry algorithms for the COSMolKit migration"
keywords = ["cheminformatics", "molecule", "chemistry"]
categories = ["science", "data-structures"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[lib]
name = "cosmolkit_core"
path = "src/lib.rs"

[features]
default = []
# Kept as empty compatibility selectors while the runtime-owned contract
# machinery is being moved to `cosmolkit`; detached algorithms have no runtime
# checks to enable here.
runtime-invariants = []
op-contracts = []
op-contracts-strict = ["runtime-invariants", "op-contracts"]

[dependencies]
cosmolkit-model = { version = "0.5.0-rc.3", path = "../cosmolkit-model" }
cosmolkit-ringdecomposer = { version = "0.5.0-rc.3", path = "../cosmolkit-ringdecomposer" }
cosmolkit-types = { version = "0.5.0-rc.3", path = "../cosmolkit-types" }
thiserror = "2.0.18"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
