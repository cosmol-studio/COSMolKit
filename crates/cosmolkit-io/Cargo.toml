[package]
name = "cosmolkit-io"
description = "SDF, PDB, XYZ, and related detached molecular IO"
keywords = ["cheminformatics", "sdf", "pdb", "xyz", "io"]
categories = ["parser-implementations", "science"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[features]
default = ["molecule"]
# Internal format branches, not facade public capabilities. BIO-only facade
# builds disable these defaults and activate only `bio`.
molecule = ["dep:cosmolkit-core", "dep:cosmolkit-search", "dep:serde", "dep:postcard", "dep:musli", "dep:cosmolkit-depict"]
bio = ["dep:cosmolkit-bio"]
# Forwarding feature (BIO-ROWS-PROBE): enables only the existing optional
# BIO dependency's test-probes feature; no new dependency edge, no
# default activation.
test-probes = ["bio", "cosmolkit-bio/test-probes"]

[dependencies]
cosmolkit-depict = { version = "0.5.0-rc.12", path = "../cosmolkit-depict", optional = true }
cosmolkit-bio = { version = "0.5.0-rc.12", path = "../cosmolkit-bio", optional = true }
cosmolkit-core = { version = "0.5.0-rc.12", path = "../cosmolkit-core", optional = true }
cosmolkit-model = { version = "0.5.0-rc.12", path = "../cosmolkit-model" }
cosmolkit-search = { version = "0.5.0-rc.12", path = "../cosmolkit-search", optional = true, default-features = false }
cosmolkit-types = { version = "0.5.0-rc.12", path = "../cosmolkit-types" }
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"], optional = true }
postcard = { version = "1.1.3", features = ["alloc"], optional = true }
# Archive codec 2 is pinned independently of package/schema versions.
musli = { version = "=0.1.8", default-features = false, features = ["std", "alloc", "storage"], optional = true }

[[test]]
name = "migration_io_bio_rows"
required-features = ["bio", "test-probes"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "migration_io_cif"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_pdb"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_mmcif"
required-features = ["bio"]

[[test]]
name = "migration_io_mmjson"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_chemcomp"
required-features = ["bio"]

[[test]]
name = "migration_io_bio_read"
required-features = ["bio"]

[[test]]
name = "migration_io_cif_alloc"
required-features = ["bio"]

[[test]]
name = "migration_io_mol_post"
required-features = ["molecule"]

[[test]]
name = "migration_io_sdf_props"
required-features = ["molecule"]

[[test]]
name = "migration_io_sdf_read"
required-features = ["molecule"]

[[test]]
name = "migration_io_v2000_props"
required-features = ["molecule"]

[[test]]
name = "migration_io_v2000_read"
required-features = ["molecule"]

[[test]]
name = "migration_io_v3000_attchord"
required-features = ["molecule"]

[[test]]
name = "migration_io_v3000_read"
required-features = ["molecule"]

[[test]]
name = "bio_pdb_write"
required-features = ["bio"]
