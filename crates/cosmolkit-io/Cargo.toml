[package]
name = "cosmolkit-io"
description = "SDF, PDB, XYZ, and related detached molecular IO"
keywords = ["cheminformatics", "sdf", "pdb", "xyz", "io"]
categories = ["parser-implementations", "science"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-bio = { version = "0.5.0-rc.4", path = "../cosmolkit-bio" }
cosmolkit-core = { version = "0.5.0-rc.4", path = "../cosmolkit-core" }
cosmolkit-model = { version = "0.5.0-rc.4", path = "../cosmolkit-model" }
cosmolkit-search = { version = "0.5.0-rc.4", path = "../cosmolkit-search" }
cosmolkit-types = { version = "0.5.0-rc.4", path = "../cosmolkit-types" }
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3"
