[package]
name = "cosmolkit-depict"
description = "Molecular depiction algorithms over detached model values"
keywords = ["cheminformatics", "depiction", "svg", "molecules"]
categories = ["science", "rendering"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
glam = "=0.34.1"
tiny-skia = "=0.12.0"
# Rasterize generated SVG with embedded fonts; no system fonts or image inputs.
usvg = { version = "=0.48.1", default-features = false, features = ["text"] }
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
thiserror = "2"
cosmolkit-core = { version = "0.5.0-rc.21", path = "../cosmolkit-core" }
cosmolkit-model = { version = "0.5.0-rc.21", path = "../cosmolkit-model" }
cosmolkit-search = { version = "0.5.0-rc.21", path = "../cosmolkit-search", default-features = false }
