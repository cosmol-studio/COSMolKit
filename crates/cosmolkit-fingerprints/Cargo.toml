[package]
name = "cosmolkit-fingerprints"
description = "Molecular fingerprints over COSMolKit detached model values"
keywords = ["cheminformatics", "fingerprints", "molecular-similarity"]
categories = ["science", "algorithms"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-macros = { version = "0.6.0-rc.2", path = "../cosmolkit-macros" }
cosmolkit-core = { version = "0.6.0-rc.2", path = "../cosmolkit-core" }
cosmolkit-model = { version = "0.6.0-rc.2", path = "../cosmolkit-model" }
cosmolkit-search = { version = "0.6.0-rc.2", path = "../cosmolkit-search", default-features = false, features = ["smiles-integration"] }

cosmolkit-stereo = { version = "0.6.0-rc.2", path = "../cosmolkit-stereo", default-features = false }

serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
cosmolkit-model = { version = "0.6.0-rc.2", path = "../cosmolkit-model", features = ["runtime-invariants", "op-contracts"] }
cosmolkit-smiles = { version = "0.6.0-rc.2", path = "../cosmolkit-smiles" }
