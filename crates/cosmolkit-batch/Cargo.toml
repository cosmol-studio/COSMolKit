[package]
name = "cosmolkit-batch"
description = "Detached batch records and batch processing for COSMolKit"
keywords = ["cheminformatics", "batch", "parallel"]
categories = ["science", "concurrency"]
repository.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
readme = "../cosmolkit/README.md"
documentation = "https://docs.rs/cosmolkit"

[dependencies]
cosmolkit-model = { version = "0.5.0-rc.21", path = "../cosmolkit-model" }
cosmolkit-io = { version = "0.5.0-rc.21", path = "../cosmolkit-io", default-features = false, features = ["molecule"] }
rayon = "1.10"
indicatif = "0.18.6"
thiserror = "2.0.18"
