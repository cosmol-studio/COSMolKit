[package]
name = "cosmolkit-wasm"
description = "Binding-facing WASM API for COSMolKit"
keywords = ["cheminformatics", "wasm", "webassembly", "molecule"]
categories = ["science", "wasm"]
repository = "https://github.com/cosmol-studio/COSMolKit"
homepage = "https://tools.cosmol.org/"
documentation = "https://docs.rs/cosmolkit-wasm"
license.workspace = true
version = "0.5.0-rc.4"
edition.workspace = true
publish = false

[lib]
name = "cosmolkit_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["full"]
full = [
    "aromaticity",
    "depict",
    "descriptors",
    "hydrogens",
    "io",
    "kekulize",
    "radicals",
    "rings",
    "sanitize",
    "smiles",
    "valence",
]
aromaticity = ["cosmolkit/aromaticity"]
depict = ["cosmolkit/depict"]
descriptors = ["cosmolkit/descriptors"]
hydrogens = ["cosmolkit/hydrogens"]
io = ["cosmolkit/io"]
kekulize = ["cosmolkit/kekulize"]
radicals = ["cosmolkit/radicals"]
rings = ["cosmolkit/rings"]
sanitize = ["cosmolkit/sanitize"]
smiles = ["cosmolkit/smiles"]
valence = ["cosmolkit/valence"]

[dependencies]
cosmolkit = { version = "0.5.0-rc.4", path = "../crates/cosmolkit", default-features = false }
