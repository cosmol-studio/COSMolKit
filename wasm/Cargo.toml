[package]
name = "cosmolkit-wasm"
version = "0.6.0-rc.4"
description = "JavaScript and TypeScript bindings for COSMolKit"
license = "MIT"
repository = "https://github.com/cosmol-studio/COSMolKit"
edition = "2024"
publish = false

[workspace]
members = ["macros"]

[lib]
name = "cosmolkit_wasm"
crate-type = ["cdylib"]

[features]
# Generated from the Rust facade by features.py --write.
default = ["full"]
runtime-invariants = ["cosmolkit/runtime-invariants"]
op-contracts = ["cosmolkit/op-contracts"]
op-contracts-strict = ["cosmolkit/op-contracts-strict", "runtime-invariants", "op-contracts"]
full = ["cosmolkit/full", "core", "bio", "conformer", "depict", "descriptors", "fingerprints", "inchi", "search", "tautomer", "stereoisomers", "reaction"]
core = ["cosmolkit/core", "cap-smiles", "cap-hydrogens", "cap-valence", "cap-radicals", "cap-rings", "cap-matrices", "cap-transforms", "cap-stereo", "cap-kekulize", "cap-aromaticity", "cap-sanitize", "cap-io", "cap-serialization", "cap-batch"]
bio = ["cosmolkit/bio", "cap-bio"]
descriptors = ["cosmolkit/descriptors", "cap-descriptors", "core"]
tautomer = ["cosmolkit/tautomer", "cap-tautomer", "search"]
conformer = ["cosmolkit/conformer", "cap-conformer", "cap-confseq", "cap-alignment", "cap-forcefields", "core"]
fingerprints = ["cosmolkit/fingerprints", "cap-fingerprints", "cap-hashing", "core"]
search = ["cosmolkit/search", "cap-search", "core"]
reaction = ["cosmolkit/reaction", "cap-reaction", "search"]
stereoisomers = ["cosmolkit/stereoisomers", "cap-stereoisomers", "core"]
depict = ["cosmolkit/depict", "cap-depict", "core"]
inchi = ["cosmolkit/inchi", "cap-inchi", "core"]
cap-alignment = ["cosmolkit/cap-alignment"]
cap-batch = ["cosmolkit/cap-batch", "cap-io"]
cap-bio = ["cosmolkit/cap-bio"]
cap-conformer = ["cosmolkit/cap-conformer", "cap-forcefields", "cap-alignment", "cap-io"]
cap-hydrogens = ["cosmolkit/cap-hydrogens"]
cap-confseq = ["cosmolkit/cap-confseq", "cap-conformer"]
cap-depict = ["cosmolkit/cap-depict"]
cap-descriptors = ["cosmolkit/cap-descriptors"]
cap-fingerprints = ["cosmolkit/cap-fingerprints", "cap-io"]
cap-forcefields = ["cosmolkit/cap-forcefields"]
cap-hashing = ["cosmolkit/cap-hashing"]
cap-inchi = ["cosmolkit/cap-inchi"]
cap-io = ["cosmolkit/cap-io"]
cap-matrices = ["cosmolkit/cap-matrices"]
cap-transforms = ["cosmolkit/cap-transforms"]
cap-search = ["cosmolkit/cap-search", "cap-smiles"]
cap-serialization = ["cosmolkit/cap-serialization", "cap-io"]
cap-smiles = ["cosmolkit/cap-smiles"]
cap-stereo = ["cosmolkit/cap-stereo"]
cap-stereoisomers = ["cosmolkit/cap-stereoisomers", "cap-stereo"]
cap-tautomer = ["cosmolkit/cap-tautomer", "cap-search"]
cap-valence = ["cosmolkit/cap-valence"]
cap-radicals = ["cosmolkit/cap-radicals"]
cap-reaction = ["cosmolkit/cap-reaction", "cap-search"]
cap-rings = ["cosmolkit/cap-rings"]
cap-kekulize = ["cosmolkit/cap-kekulize"]
cap-aromaticity = ["cosmolkit/cap-aromaticity"]
cap-sanitize = ["cosmolkit/cap-sanitize"]
registry-check = []
protocol-tests = []

[dependencies]
cosmolkit = { version = "0.6.0-rc.4", path = "../crates/cosmolkit", default-features = false }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
paste = "1"
cosmolkit-tsify-macros = { path = "macros" }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
