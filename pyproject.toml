[project]
name = "cosmolkit-py"
version = "0.0.0"
description = "Project-level Python environment for COSMolKit tooling and parity tests"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "maturin>=1.9.4,<2.0",
    "numpy>=2.1,<3",
    "pytest>=8.0",
    "rdkit==2026.3.1",
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "epam-indigo>=1.45.0",
    "sphinx-sitemap>=2.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "python/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "target",
    "third_party",
    "tmp",
    "python/docs/build",
]
