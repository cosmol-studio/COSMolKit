name: cargo-features

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    feature-matrix:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Check release tooling and workflow regressions
              run: |
                  python3 -m unittest discover -s dev/tools -p 'test_bump_rust_version.py' -v
                  python3 -m unittest discover -s dev/tools -p 'test_ci_coverage.py' -v

            - name: Check minimal facade
              run: cargo check -p cosmolkit --no-default-features

            - name: Test minimal facade
              run: cargo test -p cosmolkit --no-default-features --profile dev-test --features op-contracts-strict

            - name: Check leaf and composed features
              shell: bash
              run: |
                  set -euo pipefail
                  for feature in \
                      core \
                      bio \
                      conformer \
                      forcefields \
                      search \
                      cap-io \
                      inchi \
                      cap-serialization \
                      cap-descriptors \
                      cap-stereoisomers \
                      cap-reaction \
                      cap-confseq \
                      fingerprints \
                      depict \
                      cap-hashing \
                      batch
                  do
                      cargo check -p cosmolkit \
                          --no-default-features \
                          --features "$feature"
                  done

            - name: Check default full facade
              run: cargo check -p cosmolkit

            - name: Test core bundle public surface
              run: cargo test -p cosmolkit --no-default-features --profile dev-test --features core,op-contracts-strict --test feature_selection
