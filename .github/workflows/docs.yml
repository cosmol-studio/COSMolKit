name: docs

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: build docs
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Setup uv
              uses: astral-sh/setup-uv@v6

            - name: Sync documentation environment
              run: uv sync --group dev

            - name: Install package
              run: .venv/bin/maturin develop --manifest-path python/Cargo.toml

            - name: Build HTML documentation
              run: |
                  rm -rf python/docs/build/html
                  .venv/bin/python -m sphinx -W --keep-going -E -b html python/docs/source python/docs/build/html
                  .venv/bin/python python/docs/check_seo.py python/docs/build/html

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload documentation artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: python/docs/build/html

    deploy:
        name: deploy docs
        needs: build
        runs-on: ubuntu-latest
        env:
            INDEXNOW_HOST: kit.cosmol.org
            INDEXNOW_KEY: 283f8e40-25ad-4213-b83b-e5c6d3b3c5e0
            INDEXNOW_KEY_LOCATION: https://kit.cosmol.org/283f8e40-25ad-4213-b83b-e5c6d3b3c5e0.txt
            INDEXNOW_SITEMAP_URL: https://kit.cosmol.org/sitemap.xml
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: Verify deployed IndexNow key
              if: github.event_name != 'pull_request'
              run: |
                  set -euo pipefail
                  key_body=""
                  for attempt in {1..12}; do
                      if key_body="$(curl --silent --show-error --fail \
                          -H 'Cache-Control: no-cache' \
                          "${INDEXNOW_KEY_LOCATION}?deployment=${GITHUB_SHA}")" \
                          && [[ "$key_body" == "$INDEXNOW_KEY" ]]; then
                          exit 0
                      fi
                      sleep 5
                  done
                  echo "The deployed IndexNow key could not be verified." >&2
                  exit 1

            - name: Notify IndexNow
              if: github.event_name != 'pull_request'
              run: |
                  set -euo pipefail
                  payload_path="${RUNNER_TEMP}/indexnow-payload.json"
                  INDEXNOW_PAYLOAD_PATH="$payload_path" python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path
                  from urllib.parse import urlsplit
                  from urllib.request import Request, urlopen
                  from xml.etree import ElementTree

                  sitemap_url = (
                      f"{os.environ['INDEXNOW_SITEMAP_URL']}?deployment="
                      f"{os.environ['GITHUB_SHA']}"
                  )
                  request = Request(
                      sitemap_url,
                      headers={
                          "Cache-Control": "no-cache",
                          "User-Agent": "COSMolKit-Docs-IndexNow/1.0",
                      },
                  )
                  with urlopen(request, timeout=30) as response:
                      sitemap = ElementTree.fromstring(response.read())

                  namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
                  urls = [
                      location.text.strip()
                      for location in sitemap.findall(f".//{{{namespace}}}loc")
                      if location.text and location.text.strip()
                  ]
                  if not urls:
                      raise SystemExit("The deployed sitemap contains no URLs")
                  if len(urls) > 10_000:
                      raise SystemExit("The deployed sitemap exceeds IndexNow's URL limit")

                  expected_host = os.environ["INDEXNOW_HOST"]
                  invalid_urls = [
                      url
                      for url in urls
                      if urlsplit(url).scheme != "https"
                      or urlsplit(url).netloc != expected_host
                  ]
                  if invalid_urls:
                      raise SystemExit(
                          f"The deployed sitemap contains invalid URLs: {invalid_urls!r}"
                      )

                  payload = {
                      "host": expected_host,
                      "key": os.environ["INDEXNOW_KEY"],
                      "keyLocation": os.environ["INDEXNOW_KEY_LOCATION"],
                      "urlList": urls,
                  }
                  Path(os.environ["INDEXNOW_PAYLOAD_PATH"]).write_text(
                      json.dumps(payload, separators=(",", ":")),
                      encoding="utf-8",
                  )
                  print(f"Prepared {len(urls)} canonical URLs for IndexNow")
                  PY
                  curl --fail-with-body --silent --show-error \
                      -H "Content-Type: application/json; charset=utf-8" \
                      -X POST "https://api.indexnow.org/indexnow" \
                      --data-binary "@${payload_path}"
