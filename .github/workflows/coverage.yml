name: coverage

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    rust-coverage:
        runs-on: ubuntu-latest
        env:
            # Use the optimized development-test profile for all test stages.
            RUST_MIN_STACK: "8388608"
            PARITY_CACHE_SCHEMA: fixed-v1
            # show-env derives its build directory from CARGO_TARGET_DIR.
            # Keep it equal to the profile directory before evaluating show-env.
            CARGO_TARGET_DIR: target/coverage-build
            CARGO_LLVM_COV_TARGET_DIR: target/coverage-build
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: false
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: unified-dev-test-coverage-v3
                  key: ${{ hashFiles('crates/**/*.rs', 'parity-tests_fixed/**/*.rs') }}
                  workspaces: |
                      . -> target/rust-build
                      . -> target/coverage-build
                  cache-workspace-crates: true
                  cache-on-failure: true
            - uses: taiki-e/install-action@cargo-llvm-cov

            - name: Select current Rust libraries and runner regressions
              shell: bash
              run: |
                  cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/workspace.json"
                  jq -r '. as $workspace | .packages[] |
                      select(.id as $id | $workspace.workspace_members | index($id)) |
                      select(.publish != [] or .name == "cosmolkit-parity-tests-fixed") |
                      .name' "$RUNNER_TEMP/workspace.json" > "$RUNNER_TEMP/test-packages.txt"
                  test -s "$RUNNER_TEMP/test-packages.txt"
                  cat "$RUNNER_TEMP/test-packages.txt"

            - name: Build libraries before fetching third-party test sources
              shell: bash
              run: |
                  set -euo pipefail
                  packages=()
                  while IFS= read -r package; do packages+=(-p "$package"); done < "$RUNNER_TEMP/test-packages.txt"
                  cargo llvm-cov clean --workspace --profraw-only
                  coverage_env="$(cargo llvm-cov show-env --sh)"
                  eval "$coverage_env"
                  export CARGO_TARGET_DIR="$CARGO_LLVM_COV_TARGET_DIR"
                  cargo build "${packages[@]}" --lib --profile dev-test \
                      --features cosmolkit/op-contracts-strict

            - name: Fetch pinned test sources only after successful compilation
              run: git submodule update --init --depth 1 third_party/gemmi third_party/rdkit

            - name: Run all default crate regression suites with coverage
              id: regression
              continue-on-error: true
              shell: bash
              run: |
                  packages=()
                  while IFS= read -r package; do
                      if [[ "$package" != cosmolkit-parity-tests-fixed ]]; then packages+=(-p "$package"); fi
                  done < "$RUNNER_TEMP/test-packages.txt"
                  # show-env instrumentation is shared by every ordinary Cargo stage.
                  # Do not combine it with cargo-llvm-cov's separate test wrapper.
                  coverage_env="$(cargo llvm-cov show-env --sh)"
                  eval "$coverage_env"
                  export CARGO_TARGET_DIR="$CARGO_LLVM_COV_TARGET_DIR"
                  status=0
                  cargo test "${packages[@]}" --profile dev-test \
                      --features cosmolkit/op-contracts-strict \
                      --no-fail-fast || status=$?
                  # The runner's corpus target belongs AFTER reference preparation.
                  cargo test -p cosmolkit-parity-tests-fixed --lib --bins --profile dev-test \
                      --features cosmolkit/op-contracts-strict \
                      --no-fail-fast || status=$?
                  exit "$status"

            - name: Run documentation tests
              id: doctests
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              continue-on-error: true
              shell: bash
              run: |
                  export CARGO_TARGET_DIR=target/rust-build
                  packages=()
                  while IFS= read -r package; do packages+=(-p "$package"); done < "$RUNNER_TEMP/test-packages.txt"
                  cargo test "${packages[@]}" --profile dev-test --doc --no-fail-fast \
                      --features cosmolkit/op-contracts-strict

            - uses: actions/setup-python@v5
              id: python
              with:
                  python-version: "3.13.12"
            - uses: astral-sh/setup-uv@v6
            - name: Install pinned reference environment
              run: uv sync --locked --group dev

            # Exact identity prefix only: never restore another corpus/environment.
            # A unique suffix lets a repaired generation replace a corrupt cache.
            - name: Restore reference generations
              id: reference_cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      parity-tests_fixed/expected/corpus
                      parity-tests_fixed/expected/special
                  key: parity-${{ env.PARITY_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'parity-tests_fixed/Cargo.toml', 'parity-tests_fixed/src/**', 'parity-tests_fixed/tools/**', 'parity-tests_fixed/testdata/**', 'tools/oracles/**', 'tools/testdata/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      parity-${{ env.PARITY_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'parity-tests_fixed/Cargo.toml', 'parity-tests_fixed/src/**', 'parity-tests_fixed/tools/**', 'parity-tests_fixed/testdata/**', 'tools/oracles/**', 'tools/testdata/**') }}-

            - name: Prepare and validate all reference values
              id: prepare
              continue-on-error: true
              shell: bash
              run: |
                  set -euo pipefail
                  # Reuse the same instrumented libraries and dev-test/strict settings.
                  coverage_env="$(cargo llvm-cov show-env --sh)"
                  eval "$coverage_env"
                  export CARGO_TARGET_DIR="$CARGO_LLVM_COV_TARGET_DIR"
                  cargo build -p cosmolkit-parity-tests-fixed --profile dev-test \
                      --bin cosmolkit-parity-tests-fixed \
                      --features cosmolkit/op-contracts-strict
                  # Sequential generator calls; each Python function parallelizes cases.
                  set +e
                  status=0
                  for selection in "--corpus smiles_5000" "--corpus bio_small" "--special all"; do
                      read -r flag name <<< "$selection"
                      "$CARGO_TARGET_DIR/dev-test/cosmolkit-parity-tests-fixed" prepare \
                          "$flag" "$name" --threads "$(nproc)" \
                          2>&1 | tee -a "$RUNNER_TEMP/parity-prepare.log"
                      statuses=("${PIPESTATUS[@]}")
                      if [[ ${statuses[0]} != 0 ]]; then status=${statuses[0]}; fi
                      if [[ ${statuses[1]} != 0 ]]; then status=${statuses[1]}; fi
                  done
                  set -e
                  if [[ "$status" == 0 ]] && grep -Eq '^Prepared: [1-9][0-9]* generated, [0-9]+ reused, [0-9]+ rows$' "$RUNNER_TEMP/parity-prepare.log"; then
                      echo "regenerated=true" >> "$GITHUB_OUTPUT"
                  fi
                  exit "$status"

            - name: Run all parity integration targets with coverage
              id: parity
              if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
              continue-on-error: true
              shell: bash
              run: |
                  set -o pipefail
                  coverage_env="$(cargo llvm-cov show-env --sh)"
                  eval "$coverage_env"
                  export CARGO_TARGET_DIR="$CARGO_LLVM_COV_TARGET_DIR"
                  # The standard runner validates selected references before CK calls.
                  status=0
                  for corpus in smiles_5000 bio_small; do
                      PARITY_CORPUS="$corpus" cargo test -p cosmolkit-parity-tests-fixed \
                          --profile dev-test --test corpus --no-fail-fast \
                          --features cosmolkit/op-contracts-strict \
                          2>&1 | tee -a "$RUNNER_TEMP/parity-5000.log" || status=$?
                  done
                  PARITY_SPECIAL=all cargo test -p cosmolkit-parity-tests-fixed \
                      --profile dev-test --test special_regression --no-fail-fast \
                      --features cosmolkit/op-contracts-strict \
                      2>&1 | tee -a "$RUNNER_TEMP/parity-5000.log" || status=$?
                  exit "$status"

            - name: Save validated reference generations
              if: ${{ !cancelled() && steps.prepare.outputs.regenerated == 'true' }}
              uses: actions/cache/save@v4
              with:
                  path: |
                      parity-tests_fixed/expected/corpus
                      parity-tests_fixed/expected/special
                  key: ${{ steps.reference_cache.outputs.cache-primary-key }}

            - name: Upload parity results
              if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
              uses: actions/upload-artifact@v4
              with:
                  name: parity-5000-results
                  path: |
                      ${{ runner.temp }}/parity-prepare.log
                      ${{ runner.temp }}/parity-5000.log
                      parity-tests_fixed/reports/**/*.json
                  if-no-files-found: error

            - name: Generate coverage reports
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              shell: bash
              run: |
                  packages=()
                  while IFS= read -r package; do packages+=(-p "$package"); done < "$RUNNER_TEMP/test-packages.txt"
                  for format in html lcov; do
                      report_log="$(mktemp)"
                      output=(--html --output-dir target/llvm-cov/html)
                      if [[ "$format" == lcov ]]; then output=(--lcov --output-path lcov.info); fi
                      if ! cargo llvm-cov report "${packages[@]}" --profile dev-test "${output[@]}" 2>"$report_log"; then
                          cat "$report_log" >&2
                          exit 1
                      fi
                      cat "$report_log" >&2
                      if grep -Eq '[0-9]+ functions have mismatched data' "$report_log"; then
                          echo "Coverage profiles do not match the instrumented objects." >&2
                          exit 1
                      fi
                  done

            - name: Upload HTML coverage
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              uses: actions/upload-artifact@v4
              with:
                  name: llvm-cov-html
                  path: target/llvm-cov/html
                  if-no-files-found: error

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() && steps.regression.outcome != 'skipped' }}
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: lcov.info
                  flags: rust
                  name: rust-regressions-and-parity
                  fail_ci_if_error: false

            - name: Remove raw coverage measurements before caching builds
              if: ${{ always() }}
              run: cargo llvm-cov clean --workspace --profraw-only

            - name: Preserve test failure status
              if: ${{ !cancelled() && (steps.regression.outcome == 'failure' || steps.doctests.outcome == 'failure' || steps.prepare.outcome == 'failure' || steps.parity.outcome == 'failure') }}
              run: exit 1
