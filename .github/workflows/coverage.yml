name: coverage

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    rust-coverage:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Setup uv
              uses: astral-sh/setup-uv@v6

            - name: Sync dev environment
              run: uv sync --group dev

            - name: Regenerate RDKit goldens from tests/smiles.smi
              run: |
                  .venv/bin/python tests/scripts/gen_all_rdkit_goldens.py --python .venv/bin/python --clean --jobs 4

            - name: Run cosmolkit-core tests with coverage instrumentation
              id: cov_run
              continue-on-error: true
              run: |
                  cargo llvm-cov clean --workspace
                  cargo llvm-cov -p cosmolkit-core --release --features op-contracts-strict --no-report

            - name: Run exhaustive SMILES writer parity with coverage instrumentation
              id: smiles_writer_full
              continue-on-error: true
              run: |
                  cargo llvm-cov -p cosmolkit-core --release --features op-contracts-strict --test rdkit_smiles_writer_parity --no-report -- --ignored smiles_writer_matches_rdkit_golden_across_param_branches

            - name: Run exhaustive SDF reader parity with coverage instrumentation
              id: sdf_reader_full
              continue-on-error: true
              run: |
                  cargo llvm-cov -p cosmolkit-core --release --features op-contracts-strict --test rdkit_sdf_read_parity --no-report -- --ignored sdf_read_all_apis_and_parameters_match_rdkit

            - name: Generate HTML coverage report
              if: always()
              run: cargo llvm-cov report -p cosmolkit-core --release --features op-contracts-strict --html --output-dir target/llvm-cov/html

            - name: Generate LCOV coverage report
              if: always()
              run: cargo llvm-cov report -p cosmolkit-core --release --features op-contracts-strict --lcov --output-path lcov.info

            - name: Upload HTML coverage artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: llvm-cov-html
                  path: target/llvm-cov/html
                  if-no-files-found: error

            - name: Upload coverage to Codecov
              if: always()
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: lcov.info
                  flags: rust
                  name: rust-llvm-cov
                  fail_ci_if_error: false
                  verbose: true

            - name: Fail workflow if tests failed
              if: steps.cov_run.outcome == 'failure' || steps.smiles_writer_full.outcome == 'failure' || steps.sdf_reader_full.outcome == 'failure'
              run: |
                  echo "Rust tests failed. Coverage artifacts were still generated and uploaded."
                  exit 1
