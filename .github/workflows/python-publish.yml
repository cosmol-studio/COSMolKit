name: python-publish

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate-stubs:
        name: generate pyi stubs
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: Swatinem/rust-cache@v2

            - name: Generate pyi stubs (release pipeline only)
              run: cargo run -p cosmolkit-py --no-default-features --features dev-stub --bin stub_gen

            - name: Upload pyi artifact
              uses: actions/upload-artifact@v4
              with:
                  name: python-stubs
                  path: python/cosmolkit.pyi
                  if-no-files-found: error

    build-wheels:
        name: build wheel ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        needs:
            - generate-stubs
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x86_64
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: linux-aarch64
                      os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: macos-universal2
                      os: macos-latest
                      target: universal2-apple-darwin
                      manylinux: auto
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      manylinux: auto

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python

            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  args: --release --manifest-path Cargo.toml --features release-abi3-py39 --out dist

            - name: Upload wheels
              uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.name }}
                  path: python/dist

    build-sdist:
        name: build sdist
        runs-on: ubuntu-latest
        needs:
            - generate-stubs

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python

            - name: Copy README into python package
              run: cp README.md python/README.md

            - name: Rewrite sdist README path
              run: sed -i 's#readme = "../README.md"#readme = "./README.md"#' python/pyproject.toml

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  working-directory: python
                  args: --manifest-path Cargo.toml --out dist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: sdist
                  path: python/dist

    publish:
        name: publish to pypi
        runs-on: ubuntu-latest
        needs:
            - build-wheels
            - build-sdist

        steps:
            - name: Download wheel artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true

            - name: Download sdist artifact
              uses: actions/download-artifact@v4
              with:
                  name: sdist
                  path: dist

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
