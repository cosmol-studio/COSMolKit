name: publish

on:
  push:
      tags:
          - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish RC versions to PyPI and npm (stable releases require a tag push)"
        type: boolean
        default: false

permissions:
    contents: write

jobs:
    generate-stubs:
        name: generate pyi stubs
        runs-on: ubuntu-latest
        outputs:
            manual_publish_allowed: ${{ steps.release_policy.outputs.manual_publish_allowed }}

        steps:
            - uses: actions/checkout@v4
            - uses: Swatinem/rust-cache@v2

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Check release policy
              id: release_policy
              env:
                  PUBLISH_REQUESTED: ${{ inputs.publish }}
              run: |
                  python -m unittest discover -s dev/tools -p test_publish_policy.py -v
                  python dev/tools/publish_policy.py

            - name: Generate pyi stubs (release pipeline only)
              run: cargo run -p cosmolkit-py --no-default-features --features dev-stub --bin stub_gen

            - name: Upload pyi artifact
              uses: actions/upload-artifact@v4
              with:
                  name: python-stubs
                  path: python/cosmolkit.pyi
                  if-no-files-found: error

    build-wasm:
        name: build and test npm package
        runs-on: ubuntu-latest
        needs:
            - generate-stubs
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - uses: taiki-e/install-action@v2
              with:
                  tool: alef@0.83.3,wasm-bindgen-cli@0.2.128
            - name: Build and validate npm package
              env:
                  CARGO_TARGET_DIR: ${{ github.workspace }}/target
              run: |
                  python -m unittest discover -s wasm/tools/wasm_binding -p 'test_*.py' -v
                  python -B wasm/tools/wasm_binding/run.py --out-dir target/npm/cosmolkit
                  npm pack --dry-run --json ./target/npm/cosmolkit
            - name: Upload npm package
              uses: actions/upload-artifact@v4
              with:
                  name: npm-package
                  path: target/npm/cosmolkit
                  if-no-files-found: error

    build-wheels:
        name: build wheel ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        needs:
            - generate-stubs
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x86_64
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: linux-aarch64
                      os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: macos-universal2
                      os: macos-latest
                      target: universal2-apple-darwin
                      manylinux: auto
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      manylinux: auto

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python

            - name: Setup CPython 3.10
              if: runner.os != 'Linux'
              id: py310
              uses: actions/setup-python@v7
              with:
                  python-version: "3.10"
                  update-environment: false

            - name: Setup CPython 3.11
              if: runner.os != 'Linux'
              id: py311
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  update-environment: false

            - name: Setup CPython 3.12
              if: runner.os != 'Linux'
              id: py312
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  update-environment: false

            - name: Build abi3 wheel
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  sccache: true
                  args:  >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-abi3-py39
                      --out dist

            - name: Build selected CPython wheels
              if: runner.os == 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter python3.10 python3.11 python3.12
                      --out dist

            # macOS / Windows: 用 setup-python 给出的绝对路径
            - name: Build CPython 3.10 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py310.outputs.python-path }}"
                      --out dist

            - name: Build CPython 3.11 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py311.outputs.python-path }}"
                      --out dist

            - name: Build CPython 3.12 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py312.outputs.python-path }}"
                      --out dist

            - name: Upload wheels
              uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.name }}
                  path: python/dist

    build-sdist:
        name: build sdist
        runs-on: ubuntu-latest
        needs:
            - generate-stubs

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python

            - name: Copy README into python package
              run: cp README.md python/README.md

            - name: Rewrite sdist README path
              run: sed -i 's#readme = "../README.md"#readme = "./README.md"#' python/pyproject.toml

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  working-directory: python
                  args: --manifest-path Cargo.toml --out dist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: sdist
                  path: python/dist

    publish:
        name: publish to PyPI and npm
        permissions:
            contents: read
            id-token: write
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && needs.generate-stubs.outputs.manual_publish_allowed == 'true') }}
        runs-on: ubuntu-latest
        needs:
            - generate-stubs
            - build-wheels
            - build-sdist
            - build-wasm

        steps:
            - name: Download wheel artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true

            - name: Download sdist artifact
              uses: actions/download-artifact@v4
              with:
                  name: sdist
                  path: dist

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Download npm package
              uses: actions/download-artifact@v4
              with:
                  name: npm-package
                  path: npm-package

            - name: Publish to npm
              working-directory: npm-package
              run: |
                  npm_tag="$(node -p "require('./package.json').version.includes('-') ? 'rc' : 'latest'")"
                  npm publish --access public --tag "$npm_tag"
