name: publish

on:
  push:
      tags:
          - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish dev/RC versions to PyPI, npm and Anaconda.org (stable releases require a tag push)"
        type: boolean
        default: false

permissions:
    contents: write

jobs:
    generate-stubs:
        name: generate pyi stubs
        runs-on: ubuntu-latest
        outputs:
            manual_publish_allowed: ${{ steps.release_policy.outputs.manual_publish_allowed }}
            conda_label: ${{ steps.release_policy.outputs.conda_label }}

        steps:
            - uses: actions/checkout@v4
            - uses: Swatinem/rust-cache@v2

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install stub dependencies
              run: |
                  python -m pip install numpy
                  cargo install pyo3-introspection --version 0.30.1 --locked

            - name: Check release policy
              id: release_policy
              env:
                  PUBLISH_REQUESTED: ${{ inputs.publish }}
              run: |
                  python -m unittest discover -s dev/tools -p test_publish_policy.py -v
                  python dev/tools/publish_policy.py

            - name: Generate pyi stubs (release pipeline only)
              run: |
                  python python/build_stubs.py

            - name: Upload pyi artifact
              uses: actions/upload-artifact@v4
              with:
                  name: python-stubs
                  path: |
                      python/artifacts/smoke/package/cosmolkit/__init__.py
                      python/artifacts/smoke/package/cosmolkit/__init__.pyi
                      python/artifacts/smoke/package/cosmolkit/py.typed
                  if-no-files-found: error

    build-wasm:
        name: build and test npm presets
        runs-on: ubuntu-latest
        # One runner builds presets serially and reuses the same Cargo target.
        env:
            CARGO_TARGET_DIR: ${{ github.workspace }}/target/wasm
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: wasm-presets-v2
                  workspaces: "wasm -> ../target/wasm"
                  cache-workspace-crates: true
                  cache-on-failure: true
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - uses: taiki-e/install-action@v2
              with:
                  tool: wasm-bindgen-cli@0.2.128
            - name: Test WASM build tooling
              run: python -m unittest discover -s wasm/tests -p 'test_*.py' -v
            - name: Build and validate npm presets serially
              env:
                  NPM_PACKAGE_ROOT: ${{ runner.temp }}/cosmolkit-npm
              run: |
                  set -euo pipefail
                  # Validate every preset against its compiled binding registry and JS/TS tests.
                  for preset in core core-search core-fingerprints core-analysis core-reaction core-depict core-3d core-bio core-inchi full; do
                      echo "::group::Build and validate npm $preset"
                      package_dir="$NPM_PACKAGE_ROOT/npm-package-$preset"
                      python -B wasm/build.py --preset "$preset" --check
                      python -B wasm/build.py --preset "$preset" --release --target web --out-dir "$package_dir"
                      npm pack --dry-run --json "$package_dir"
                      echo "::endgroup::"
                  done

            - name: Upload npm presets
              uses: actions/upload-artifact@v4
              with:
                  name: npm-presets
                  path: ${{ runner.temp }}/cosmolkit-npm
                  if-no-files-found: error

    build-wheels:
        name: build wheel ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        needs:
            - generate-stubs
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x86_64
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: linux-aarch64
                      os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: macos-universal2
                      os: macos-latest
                      target: universal2-apple-darwin
                      manylinux: auto
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      manylinux: auto

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python/artifacts/smoke/package/cosmolkit

            - name: Setup CPython 3.11
              if: runner.os != 'Linux'
              id: py311
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  update-environment: false

            - name: Setup CPython 3.12
              if: runner.os != 'Linux'
              id: py312
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  update-environment: false

            - name: Setup CPython 3.13
              if: runner.os != 'Linux'
              id: py313
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  update-environment: false

            - name: Build abi3 wheel
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  sccache: true
                  args:  >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-abi3-py39
                      --out dist

            - name: Build selected CPython wheels
              if: runner.os == 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter python3.11 python3.12 python3.13
                      --out dist

            # macOS / Windows: use absolute paths provided by setup-python.
            - name: Build CPython 3.11 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py311.outputs.python-path }}"
                      --out dist

            - name: Build CPython 3.12 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py312.outputs.python-path }}"
                      --out dist

            - name: Build CPython 3.13 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py313.outputs.python-path }}"
                      --out dist

            - name: Upload wheels
              uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.name }}
                  path: python/dist

    build-sdist:
        name: build sdist
        runs-on: ubuntu-latest
        needs:
            - generate-stubs

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python/artifacts/smoke/package/cosmolkit

            - name: Copy README into python package
              run: cp README.md python/README.md

            - name: Rewrite sdist README path
              run: sed -i 's#readme = "../README.md"#readme = "./README.md"#' python/pyproject.toml

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  working-directory: python
                  args: --manifest-path Cargo.toml --out dist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: sdist
                  path: python/dist

    publish:
        name: publish to PyPI, npm and Anaconda.org
        permissions:
            contents: read
            id-token: write
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && needs.generate-stubs.outputs.manual_publish_allowed == 'true') }}
        runs-on: ubuntu-latest
        needs:
            - generate-stubs
            - build-wheels
            - build-sdist
            - build-wasm

        steps:
            - uses: actions/checkout@v4
            - name: Download wheel artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true

            - name: Download sdist artifact
              uses: actions/download-artifact@v4
              with:
                  name: sdist
                  path: dist

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Download npm presets
              uses: actions/download-artifact@v4
              with:
                  name: npm-presets
                  path: npm-packages

            - name: Publish separate npm preset packages
              run: |
                  set -euo pipefail
                  for preset in core core-search core-fingerprints core-analysis core-reaction core-depict core-3d core-bio core-inchi full; do
                      (
                          cd "npm-packages/npm-package-$preset"
                          npm_tag="$(node -p "require('./package.json').publishConfig.tag")"
                          npm publish --access public --tag "$npm_tag"
                      )
                  done

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - run: python -m pip install anaconda-client==1.15.0 conda-package-handling==2.6.0 installer==1.0.1 packaging
            - name: Package wheels for conda
              run: python dev/conda/package_wheels.py dist conda-dist
            - name: Publish to Anaconda.org
              env:
                  ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
                  CONDA_LABEL: ${{ needs.generate-stubs.outputs.conda_label }}
              run: |
                  test -n "$ANACONDA_API_TOKEN" || { echo 'Set the ANACONDA_API_TOKEN repository secret.' >&2; exit 1; }
                  anaconda upload --user cosmol-studio --label "$CONDA_LABEL" conda-dist/*/*.conda
