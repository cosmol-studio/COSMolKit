name: Dioxus documentation

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read


concurrency:
    group: dioxus-documentation
    cancel-in-progress: false

jobs:
    build:

        name: Build Dioxus documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Restore Rust and Dioxus build cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: docs-web-dioxus-0.7.10
                  add-job-id-key: false
                  workspaces: docs-web -> target
                  cache-targets: true
                  cache-bin: true
                  cache-all-crates: true
                  cache-workspace-crates: true
                  cache-on-failure: true
                  cache-directories: |
                      ~/.local/share/.dx

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - uses: astral-sh/setup-uv@v6

            - name: Sync documentation environment
              run: uv sync --group dev

            - name: Test deployment scripts
              run: .venv/bin/python -m unittest discover -s docs-web/scripts -p 'test_*.py' -v

            # - name: Install package for autodoc
            #   run: .venv/bin/maturin develop --manifest-path python/Cargo.toml

            - name: Install released package for autodoc
              run: |
                  uv pip install --python .venv/bin/python --only-binary=:all: cosmolkit==0.3.0

            - name: Build Sphinx source
              run: |
                  rm -rf python/docs/build/html
                  .venv/bin/python -m sphinx -W --keep-going -E -b html python/docs/source python/docs/build/html

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@main

            - name: Install Dioxus CLI
              run: cargo binstall dioxus-cli --version 0.7.10 --no-confirm --disable-strategies compile

            - name: Install search WASM binding generator
              run: .venv/bin/python docs-web/scripts/build_search_bundle.py --install-tools

            - name: Test Rust search engine
              run: cargo test --manifest-path docs-web/Cargo.toml --lib --no-default-features --features search-engine --release --target-dir docs-web/target/search-engine

            - name: Build static Dioxus site
              working-directory: docs-web
              run: |
                  public_dir="target/dx/cosmolkit-docs-web/release/web/public"
                  if [ -d "$public_dir" ]; then
                      mv "$public_dir" "$RUNNER_TEMP/docs-web-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  fi
                  dx build --release --web --fullstack true --ssg --features "ssg" --force-sequential

            - name: Prepare deployment files
              run: |
                  public_dir="docs-web/target/dx/cosmolkit-docs-web/release/web/public"
                  .venv/bin/python docs-web/scripts/prepare_deployment.py "$public_dir" python/docs/build/html
                  .venv/bin/python docs-web/scripts/check_ssg_output.py "$public_dir"

            - name: Upload Cloudflare Pages artifact
              uses: actions/upload-artifact@v4
              with:
                  name: docs-web-public
                  path: docs-web/target/dx/cosmolkit-docs-web/release/web/public
                  include-hidden-files: true
                  if-no-files-found: error

    deploy:
        # Manual runs on other branches may build, but must not publish production.
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: docs-web-public
                  path: deploy/web/public

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy ./deploy/web/public/ --project-name=cosmolkit-docs-web --branch=main
