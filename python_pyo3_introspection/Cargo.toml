[package]
name = "cosmolkit-py"
version = "0.5.1-rc.5"
edition = "2024"
publish = false

[workspace]

[lib]
name = "_native"
path = "bindings/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
extension = []

[[bin]]
name = "registry_snapshot"
path = "registry_snapshot.rs"

[dependencies]
cosmolkit = { path = "../crates/cosmolkit", default-features = false, features = ["full"] }
# Library and official extractor use the same published version.
pyo3 = { version = "=0.30.1", features = ["extension-module", "experimental-inspect", "abi3-py312", "num-bigint"] }
num-bigint = "=0.4.8"
numpy = "=0.30.0"
serde_json = "1"
paste = "1"

[profile.dev]
debug = 0
