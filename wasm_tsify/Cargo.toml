[package]
name = "cosmolkit-tsify-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmolkit = { path = "../crates/cosmolkit", default-features = false, features = ["cap-smiles", "cap-rings"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
serde = { version = "1", features = ["derive"] }
paste = "1"

[profile.dev]
debug = 0
