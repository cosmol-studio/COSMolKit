[package]
name = "cosmolkit-py"
version = "0.5.0-rc.21"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
autobins = false

[lib]
name = "cosmolkit_py"
crate-type = ["cdylib", "rlib"]
doc = false

[dependencies]
cosmolkit = { version = "0.5.0-rc.21", path = "../crates/cosmolkit" }
cosmolkit-macros = { version = "0.5.0-rc.21", path = "../crates/cosmolkit-macros" }
pyo3-stub-gen = { version = "0.23.0", default-features = false, optional = true }
pyo3-stub-gen-derive = "0.23.0"
pyo3 = { version = "0.29.0", default-features = false, features = ["num-bigint"] }
numpy = "0.29.0"
glam = "0.34.1"
serde_json = "1"
num-bigint = "0.4.8"

[build-dependencies]
pyo3-build-config = "0.29.0"

[features]
default = ["release-abi3-py39"]
drawing-bindings = []
extension-module = ["pyo3/macros", "pyo3/extension-module"]
release-abi3-py39 = ["extension-module", "pyo3/abi3-py39"]
release-cpython = ["extension-module"]
dev-abi3-py310 = ["extension-module", "pyo3/abi3-py310"]
stubgen = ["dep:pyo3-stub-gen"]
dev-stub = ["pyo3/macros", "pyo3/abi3-py310", "stubgen", "pyo3-stub-gen/infer_signature"]
# Opt-in host-interpreter tests; use with --no-default-features, never for wheels.
python-embed-tests = ["pyo3/macros"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stubgen"]
