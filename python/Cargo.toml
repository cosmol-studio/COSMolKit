[package]
name = "cosmolkit-py"
version = "0.6.0-rc.2"
edition = "2024"
publish = false

[lib]
name = "_native"
path = "bindings/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension = ["pyo3/extension-module"]
release-abi3-py39 = ["extension", "pyo3/abi3-py39"]
release-cpython = ["extension"]

[[bin]]
name = "registry_snapshot"
path = "registry_snapshot.rs"

[dependencies]
cosmolkit = { version = "0.6.0-rc.2", path = "../crates/cosmolkit", default-features = false, features = ["full"] }
# Library and official extractor use the same published version.
pyo3 = { version = "=0.30.1", features = ["experimental-inspect", "num-bigint"] }
num-bigint = "=0.4.8"
numpy = "=0.30.0"
serde_json = "1"
paste = "1"

[build-dependencies]
pyo3-build-config = "=0.30.1"
