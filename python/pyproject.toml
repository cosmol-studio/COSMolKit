[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cosmolkit"
version = "0.3.0"
description = "Python bindings for the COSMolKit Rust-native cheminformatics toolkit"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "COSMolKit Contributors" },
]
keywords = [ "cheminformatics", "molecular-informatics", "rust", "rdkit", "molecular-modeling", ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.23",
]

[project.urls]
Homepage = "https://tools.cosmol.org/"
Documentation = "https://kit.cosmol.org/"
"Technical overview" = "https://tools.cosmol.org/rust-cheminformatics"
"Rust API" = "https://docs.rs/cosmolkit"
Repository = "https://github.com/cosmol-studio/COSMolKit"
Issues = "https://github.com/cosmol-studio/COSMolKit/issues"

[tool.maturin]
module-name = "cosmolkit"
manifest-path = "Cargo.toml"
features = ["release-abi3-py39"]
