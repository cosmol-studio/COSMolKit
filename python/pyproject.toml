[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "cosmolkit"
version = "0.5.1rc5"
description = "Python bindings for the COSMolKit Rust-native cheminformatics toolkit"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "COSMolKit Contributors" }]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://tools.cosmol.org/"
Documentation = "https://kit.cosmol.org/"
Repository = "https://github.com/cosmol-studio/COSMolKit"
Issues = "https://github.com/cosmol-studio/COSMolKit/issues"

[tool.maturin]
module-name = "cosmolkit._native"
python-source = "artifacts/smoke/package"
features = ["release-abi3-py39"]
exclude = ["artifacts/smoke/package/cosmolkit/_native.so", "artifacts/smoke/package/cosmolkit/_native.pyd"]
# Generated Python sources are ignored by Git; include these package files explicitly.
include = [
    { path = "cosmolkit/__init__.py", format = "wheel" },
    { path = "cosmolkit/__init__.pyi", format = "wheel" },
    { path = "cosmolkit/py.typed", format = "wheel" },
    { path = "artifacts/smoke/package/cosmolkit/*.py", format = "sdist" },
    { path = "artifacts/smoke/package/cosmolkit/*.pyi", format = "sdist" },
    { path = "artifacts/smoke/package/cosmolkit/py.typed", format = "sdist" },
]
