<!doctype html>
<meta charset="utf-8">
<title>COSMolKit CDN example</title>
<output id="molecule">Loading...</output>
<script type="module">
  import init, { Molecule } from
    "https://cdn.jsdelivr.net/npm/@cosmol-studio/cosmolkit@0.6.0-dev.1/cosmolkit_wasm.js";

  // Load the matching WASM asset beside the version-pinned module.
  await init();
  const molecule = Molecule.fromSmiles("CCO");
  try {
    document.querySelector("#molecule").textContent = molecule.toSmiles();
  } finally {
    molecule.free();
  }
</script>
