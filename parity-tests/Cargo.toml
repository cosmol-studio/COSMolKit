[package]
name = "cosmolkit-parity-tests"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
cosmolkit = { path = "../crates/cosmolkit", default-features = false, features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

tempfile = "3"

# Only the special source-regression integration target calls detached owners.
# Public corpus parity continues to depend on cosmolkit alone.
[dev-dependencies]
cosmolkit-core = { path = "../crates/cosmolkit-core" }
cosmolkit-model = { path = "../crates/cosmolkit-model" }
cosmolkit-types = { path = "../crates/cosmolkit-types" }
