<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <style>
            html,
            body,
            #main {
                min-height: 100%;
                margin: 0;
            }

            body {
                background: #050d1b;
            }

            #initial-loader,
            #initial-template-loader {
                box-sizing: border-box;
                display: grid;
                position: fixed;
                z-index: 2147483646;
                inset: 0;
                place-items: center;
                padding: 24px;
                color: #e8edf5;
                background-color: #071426;
                background-image:
                    linear-gradient(rgba(59, 130, 246, 0.055) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(96, 165, 250, 0.05) 1px, transparent 1px),
                    linear-gradient(to bottom, #0c1c3c, #050d1b);
                background-size: 72px 72px, 72px 72px, 100% 100%;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            body:has(#wasm-ready) #initial-template-loader {
                display: none;
            }

            .initial-loader-content {
                display: flex;
                width: min(400px, 100%);
                flex-direction: column;
                align-items: center;
            }

            .initial-loader-brand {
                margin: 0;
                font-size: 26px;
                font-weight: 750;
                line-height: 1.3;
            }

            .initial-loader-brand span {
                color: #4b96ff;
            }

            .initial-loader-status {
                margin: 10px 0 22px;
                color: #91a1b5;
                font-size: 14px;
                font-weight: 600;
            }

            .initial-loader-progress {
                width: 240px;
                height: 3px;
                overflow: hidden;
                background: #203047;
            }

            .initial-loader-progress::after {
                display: block;
                width: 48%;
                height: 100%;
                content: "";
                background: #4b96ff;
                animation: initial-loader-progress 1.25s ease-in-out infinite;
            }

            @keyframes initial-loader-progress {
                0% { transform: translateX(-110%); }
                100% { transform: translateX(215%); }
            }

            @media (prefers-reduced-motion: reduce) {
                .initial-loader-progress::after {
                    animation: none;
                    transform: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div id="initial-template-loader" role="status" aria-live="polite" aria-label="Loading COSMolKit documentation">
                <div class="initial-loader-content">
                    <p class="initial-loader-brand"><span>COSMolKit</span> Docs</p>
                    <p class="initial-loader-status">Loading documentation</p>
                    <span class="initial-loader-progress" aria-hidden="true"></span>
                </div>
            </div>
        </div>
    </body>
</html>
